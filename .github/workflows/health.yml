name: Website health check

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    workflows: ['Deploy website to GitHub Pages']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: website-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check website, backend, database and CORS
        run: node scripts/check-live.mjs
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://night-city-api.night-city-predictions.workers.dev' }}
